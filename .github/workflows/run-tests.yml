# Nazwa całego procesu (workflow)
name: Java CI with Maven

# Wyzwalacz (trigger): Kiedy ma się uruchomić?
on:
  push:
    branches: [ "main" ] # Uruchom przy każdym pushu do gałęzi 'main'
  pull_request:
    branches: [ "main" ] # Uruchom przy każdym pull requeście do gałęzi 'main'

# Definicja zadań (jobs) do wykonania
jobs:
  build_and_test:
    # Nazwa zadania, która będzie widoczna w GitHub Actions
    name: Build and Run Tests
    # Na jakim systemie ma się uruchomić? (wirtualna maszyna od GitHub)
    runs-on: ubuntu-latest

    # Kroki (steps), które zostaną wykonane po kolei
    steps:
      # 1. Pobranie kodu z Twojego repozytorium
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Ustawienie środowiska Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Uruchomienie testów za pomocą Mavena
      #    Komenda 'mvn clean test' skompiluje kod i uruchomi wszystkie testy
      - name: Run Maven tests
        run: mvn clean test

      # 4. (Opcjonalnie) Publikacja raportu Allure, jeśli testy się powiodły
      #    Ten krok jest wykonywany tylko wtedy, gdy poprzednie się powiodły
      - name: Generate Allure Report
        if: always() # Uruchom ten krok zawsze, nawet jeśli testy się nie powiodą
        uses: simple-elf/allure-report-action@v1.7
        with:
          gh_pages: gh-pages # Gałąź, na której zostanie opublikowany raport
          report_dir: target/allure-results # Katalog z wynikami Allure